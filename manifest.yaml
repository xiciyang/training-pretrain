# 能力清单（安全声明）—— training-pretrain（长任务 3 · 阶段 2）
#
# 语义：本清单是**白名单**。未声明的 capability 一律视为"未声明所以拒绝"，
# 与"设计上不做"（not_provided）显式区分。
#
# 风险档沿用推理三插件与 training-sft 已固化的词表（同一台机器只应有一套）：
#   read   = R0/R1 只读，无沙箱要求，不需要确认令牌
#   write  = R1/R2 写操作，需沙箱（train/validate 声明 container）
#   system = R4 系统级，需 VM 级沙箱 —— 本机无 VM，故一律拒绝

name: @xiciyang/training-pretrain
version: 0.1.0
interface:
  mcp: "1.0.0"
  cli: "1.0.0"

capabilities:
  - id: prepare
    tool: training_pretrain_prepare
    risk: write
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: ['disk:write', 'state:read']
  - id: train
    tool: training_pretrain_train
    risk: write
    sandbox: container
    idempotent: false
    confirmation: required
    resources: ['gpu:write', 'disk:write', 'state:write', 'model:read']
  - id: validate
    tool: training_pretrain_validate
    risk: write
    sandbox: container
    idempotent: false
    confirmation: required
    resources: ['gpu:write', 'port:bind', 'state:write', 'model:read']
  - id: rollback
    tool: training_pretrain_rollback
    risk: write
    sandbox: none
    idempotent: true
    confirmation: required
    resources: ['disk:write', 'state:write']
  - id: get_report
    tool: training_pretrain_get_report
    risk: read
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: ['state:read']
  - id: health
    tool: training_pretrain_health
    risk: read
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: []

not_provided:
  - id: rl
    reason: 不做 RL/偏好优化（归 training-rl）。本包不做 reward 建模、不做 rollout。
  - id: qat
    reason: 不做量化感知训练（归 training-qat）。本包**全程 BF16**，不引入任何量化步骤。
  - id: quantization
    reason: 硬性不做：量化归 inference-quantization。预训练产出**可**作为量化输入，但量化本身不在这里。
  - id: distributed_training
    reason: v0 不做分布式（DDP/FSDP/TP/PP）；并发恒为 1。
  - id: modify_base_model
    reason: 基座模型只读；全参数权重与导出产物一律写到独立运行目录。
  - id: touch_existing_endpoints
    reason: validate 只创建并拆解**自己租用**的端点；存量端点一律只读，绝不触碰。
  - id: sanitize_data
    reason: 硬性不做：发现 PII 只**剔除整个文档**并记录哈希清单，绝不改写行内内容。
  - id: synthesize_data
    reason: 硬性不做：不自行合成训练数据（只做选择/去重/分块/分片）。
  - id: scrape_corpus
    reason: 不做语料抓取与清洗（归上游）；本包只读本地分片文件。
  - id: system_level_change
    reason: 不改宿主 OS/驱动/内核；vm 沙箱本机不可用，系统级动作一律拒绝。

dependencies:
  - name: inference-serving
    via: mcp
    purpose: validate 阶段的端点生命周期（deploy/teardown）与加载器可用性探针
    required: true
  - name: "@ai-infra/training-core"
    via: internal
    purpose: 公共训练循环 / 资源上限 / checkpoint / 审计钩子
    required: true
  - name: "@ai-infra/testing-core"
    via: internal
    purpose: 双门禁与测量判据（ε 推导 / 相对变化 / 浮点指纹）
    required: true
  - name: "@ai-infra/data-core"
    via: internal
    purpose: 去重 / 内容哈希 / 去泄漏 / PII 扫描 / 血缘
    required: true
  - name: "@ai-infra/state-core"
    via: internal
    purpose: pretrain-registry 方言与乐观并发写
    required: true
  - name: "@ai-infra/audit-core"
    via: internal
    purpose: 预训练审计哈希链
    required: true
  - name: "@ai-infra/sandbox-core"
    via: internal
    purpose: 沙箱层级行为探测与降级策略
    required: true

host:
  node: ">=20.11.0"
  runtimeDependencies: 0
